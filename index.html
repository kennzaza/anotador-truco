<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<title>Anotador de truco</title>
<style>
:root{--wood:#2f1f14;--wood2:#1e130b;--gold:#f0c75e;--gold2:#b8923a;--chalk:#f3ead0;--dim:rgba(243,234,208,.55);--stick:#efe3c0;--ink:#1d130b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--wood:#2a1b11;--wood2:#190f08}}
:root[data-theme="dark"]{color-scheme:dark;--wood:#2a1b11;--wood2:#190f08}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;display:flex;flex-direction:column;color:var(--chalk);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;
background-color:var(--wood);
background-image:
 repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 2px,transparent 2px 118px),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.3 0.008' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0 0.01 0 0 0 1.1 -0.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
 linear-gradient(180deg,var(--wood),var(--wood2))}
body{background-size:auto,100% 100%,100% 100%;background-repeat:repeat,no-repeat,no-repeat}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(14,8,4,.7);border-bottom:2px solid var(--gold2)}
h1{margin:0;font-size:1.35rem;color:var(--gold);letter-spacing:.06em;font-weight:700}
.pill{background:transparent;color:var(--gold);border:1.5px solid var(--gold2);border-radius:999px;padding:8px 16px;font:inherit;font-size:.9rem;min-height:40px}
.win{display:none;margin:10px 14px 0;background:var(--gold);color:var(--ink);padding:10px;text-align:center;font-weight:800;border-radius:12px}
.win.on{display:block}
main{flex:1;min-height:0;display:grid;grid-template-columns:68px 1fr 68px;align-items:stretch;padding:10px 6px 0}
.ctl{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.c{width:56px;height:56px;border-radius:50%;font:inherit;font-size:2rem;line-height:1;display:grid;place-items:center;cursor:pointer}
.c:active{transform:scale(.92)}
.plus{background:var(--gold);color:var(--ink);border:0;font-weight:700;box-shadow:0 3px 0 var(--gold2)}
.minus{background:rgba(14,8,4,.55);color:var(--chalk);border:2px solid var(--dim)}
.board{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.team{display:flex;flex-direction:column;min-height:0}
.team+.team{border-left:2px solid var(--gold2)}
.head{border-bottom:2px solid var(--gold2);text-align:center;padding:2px 4px 8px}
.name{width:100%;background:none;border:0;color:var(--chalk);text-align:center;font:inherit;font-size:1.15rem;font-weight:700;padding:6px 2px;border-radius:8px}
.name:focus{outline:2px solid var(--gold)}
.num{font-size:3.4rem;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.sec{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 6px;padding:8px 4px;position:relative}
.sec+.sec{border-top:2px solid var(--gold2)}
.lbl{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
svg.g{width:min(54px,44%);height:auto;overflow:visible}
.ln{stroke:var(--stick);stroke-width:4.5;stroke-linecap:round;filter:drop-shadow(0 2px 1px rgba(0,0,0,.6))}
.ghost{stroke:var(--dim);stroke-width:1.6;stroke-linecap:round;opacity:.28}
footer{display:flex;justify-content:center;padding:12px 14px 14px}
.new{background:rgba(14,8,4,.75);color:var(--chalk);border:2px solid var(--gold2);border-radius:16px;font:inherit;font-size:1.1rem;padding:0 34px;min-height:54px}
.new:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-height:640px){.num{font-size:2.6rem}.c{width:48px;height:48px}}
</style>
</head>
<body>
<header>
  <h1>TRUCO</h1>
  <button class="pill" id="mode"></button>
</header>
<div class="win" id="win" role="status"></div>
<main id="main"></main>
<footer><button class="new" id="reset">Nueva partida</button></footer>
<script>
(function(){
var S={a:0,b:0,max:30,na:"Nosotros",nb:"Ellos"};
try{var s=JSON.parse(localStorage.getItem("truco")||"null");if(s&&typeof s.a==="number")S=s;}catch(e){}
function save(){try{localStorage.setItem("truco",JSON.stringify(S));}catch(e){}}
var L=[[6,36,6,6],[6,6,36,6],[36,6,36,36],[36,36,6,36],[6,36,36,6]];
function grp(n){
  var h='<svg class="g" viewBox="0 0 42 42" aria-hidden="true">';
  for(var i=0;i<5;i++){var l=L[i];h+='<line class="'+(i<n?'ln':'ghost')+'" x1="'+l[0]+'" y1="'+l[1]+'" x2="'+l[2]+'" y2="'+l[3]+'"/>';}
  return h+'</svg>';
}
function secs(p){
  var out='<div class="sec">';
  for(var g=0;g<S.max;g+=5){out+=grp(Math.max(0,Math.min(5,p-g)));}
  return out+'</div>';
}
function team(k,nm){
  return '<section class="team"><div class="head"><input class="name" data-k="'+k+'" value="'+nm.replace(/"/g,"&quot;")+'" aria-label="Nombre del equipo" maxlength="12">'
   +'<div class="num" aria-live="polite">'+S[k]+'</div></div>'+secs(S[k])+'</section>';
}
function ctl(k){
  return '<div class="ctl"><button class="c plus" data-k="'+k+'" data-d="1" aria-label="Sumar un punto">+</button>'
   +'<button class="c minus" data-k="'+k+'" data-d="-1" aria-label="Restar un punto">−</button></div>';
}
function render(){
  document.getElementById("main").innerHTML=ctl("a")+'<div class="board">'+team("a",S.na)+team("b",S.nb)+'</div>'+ctl("b");
  document.getElementById("mode").textContent="A "+S.max;
  var w=document.getElementById("win");
  if(S.a>=S.max||S.b>=S.max){w.textContent="Ganó "+(S.a>=S.max?S.na:S.nb)+" 🏆";w.className="win on";}else{w.className="win";}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.k){var k=t.dataset.k;S[k]=Math.max(0,Math.min(S.max,S[k]+Number(t.dataset.d)));save();render();try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}}
  else if(t.id==="reset"){if(S.a+S.b===0||confirm("¿Empezar una partida nueva?")){S.a=0;S.b=0;save();render();}}
  else if(t.id==="mode"){S.max=S.max===30?15:30;S.a=Math.min(S.a,S.max);S.b=Math.min(S.b,S.max);save();render();}
});
document.addEventListener("change",function(e){
  if(e.target.classList.contains("name")){S[e.target.dataset.k==="a"?"na":"nb"]=e.target.value||"Equipo";save();render();}
});
render();
})();
</script>
</body>
</html>
